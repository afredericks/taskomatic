<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!--
        Taskomatic favicon: the same little robot as frontend/src/lib/Logo.svelte,
        winking with a tick for an eye. Baseline brand gradient baked in
        (violet oklch(62% .23 285) to magenta oklch(66% .24 340)).
    -->
    <defs>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7f64ff"/>
            <stop offset="1" stop-color="#ea3fbf"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- Antenna -->
    <line x1="32" y1="6" x2="32" y2="14" stroke="#7f64ff" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="32" cy="5" r="5" fill="#ea3fbf"/>

    <!-- Ears -->
    <rect x="0" y="30" width="6" height="16" rx="3" fill="url(#body)"/>
    <rect x="58" y="30" width="6" height="16" rx="3" fill="url(#body)"/>

    <!-- Head with a glass shine -->
    <rect x="5" y="13" width="54" height="50" rx="15" fill="url(#body)"/>
    <rect x="7" y="15" width="50" height="26" rx="13" fill="url(#shine)"/>

    <!-- Eyes: one round, one winking tick -->
    <circle cx="22.5" cy="32" r="5" fill="#fff"/>
    <path d="M34.5 32.5 L39.5 37.5 L48.5 28" fill="none" stroke="#fff" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Smile -->
    <path d="M22 45.5 Q32 52 42 45.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
